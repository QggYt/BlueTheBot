name: Copy Blue source into BlueTheBot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BlueTheBot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy every file from Blue
        run: |
          git clone --depth 1 --branch main https://github.com/QggYt/blue.git /tmp/blue-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/blue-source/. .
          rm -rf /tmp/blue-source
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Copy complete Blue bot project'
          git push origin HEAD:main

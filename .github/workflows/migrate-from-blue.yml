name: Copy Blue source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BlueTheBot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy complete Blue project
        run: |
          git clone --depth 1 https://github.com/QggYt/blue.git /tmp/blue
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/blue/. .
          rm -f .github/workflows/migrate-from-blue.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Copy complete Blue bot project' || true
          git push origin HEAD:main

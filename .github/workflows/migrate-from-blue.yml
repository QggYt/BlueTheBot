name: Copy Blue source once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy entire Blue repository into this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --depth 1 --branch main https://github.com/QggYt/blue.git /tmp/blue
          cd /tmp/blue
          rm -rf .git
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Copy complete Blue bot source'
          git branch -M main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/QggYt/BlueTheBot.git"
          git push --force origin main
